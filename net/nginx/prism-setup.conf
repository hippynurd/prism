# PRISM setup-mode nginx configuration.
# Why this exists:
# - First boot is a different product state than normal use.
# - Setup mode needs both the Iris API proxy and the setup backend.
# - Keeping it separate from the normal Iris config makes the switch explicit,
#   inspectable, and easy to reverse.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/prism-setup;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:11434/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /setup/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }
}
